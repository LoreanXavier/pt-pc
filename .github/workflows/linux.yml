name: Linux

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools and compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            glslc \
            libshaderc-dev \
            libvulkan-dev \
            vulkan-tools \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxtst-dev \
            libxss-dev \
            libxxf86vm-dev \
            libxfixes-dev \
            libxrender-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libasound2-dev \
            libpulse-dev \
            libdbus-1-dev \
            libudev-dev

      - name: Extract version
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^set(PT_VERSION "\(.*\)")$/\1/p' CMakeLists.txt)"
          fi
          echo "version=${version:-1.0.2}" >> "$GITHUB_OUTPUT"

      - name: Configure and build
        env:
          PT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cmake -G Ninja -B build/linux \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSDL_X11_XTEST=OFF \
            -DSDL_X11_XSCRNSAVER=OFF
          cmake --build build/linux --target pt pt_release

      - name: Package portable game files
        run: |
          # Use repository packager if available, otherwise assemble portable directory
          if [ -f "tools/package.py" ]; then
            python3 tools/package.py --build build/linux || true
          fi

          mkdir -p dist/P.T.PC.Port-Linux-x64
          # Select release executable or base build
          if [ -f "build/linux/pt_release" ]; then
            cp build/linux/pt_release dist/P.T.PC.Port-Linux-x64/pt
          else
            cp build/linux/pt dist/P.T.PC.Port-Linux-x64/pt
          fi
          chmod +x dist/P.T.PC.Port-Linux-x64/pt

          # Copy compiled runtime folders (shaders, fonts, etc.)
          for dir in shaders fonts textures; do
            if [ -d "build/linux/$dir" ]; then
              cp -r "build/linux/$dir" dist/P.T.PC.Port-Linux-x64/
            fi
          done

          cd dist
          zip -r P.T.PC.Port-Linux-x64.zip P.T.PC.Port-Linux-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: P.T.PC.Port-Linux-x64-${{ steps.version.outputs.version }}
          path: dist/P.T.PC.Port-Linux-x64.zip
