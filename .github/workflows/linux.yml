name: Linux

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools and SDL3 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            shaderc \
            libvulkan-dev \
            vulkan-tools \
            libxtst-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libasound2-dev \
            libpulse-dev

      - name: Extract version
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^set(PT_VERSION "\(.*\)")$/\1/p' CMakeLists.txt)"
          fi
          echo "version=${version:-1.0.2}" >> "$GITHUB_OUTPUT"

      - name: Configure CMake and build targets
        env:
          PT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cmake -G Ninja -B build/linux \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DSDL_X11_XTEST=OFF
          cmake --build build/linux --target pt pt_release

      - name: Package game files
        run: |
          mkdir -p dist/P.T.PC.Port-Linux-x64
          # Copy executable and compiled game assets
          cp build/linux/pt_release dist/P.T.PC.Port-Linux-x64/pt
          chmod +x dist/P.T.PC.Port-Linux-x64/pt
          for dir in shaders fonts textures; do
            if [ -d "build/linux/$dir" ]; then
              cp -r "build/linux/$dir" dist/P.T.PC.Port-Linux-x64/
            fi
          done
          cd dist
          zip -r P.T.PC.Port-Linux-x64.zip P.T.PC.Port-Linux-x64

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: P.T.PC.Port-Linux-x64-${{ steps.version.outputs.version }}
          path: dist/P.T.PC.Port-Linux-x64.zip
